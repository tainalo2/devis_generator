name: VIBED release

# Tags vibed-v* must point at a commit on branch vibed that contains this workflow.
# Does not replace docker-release.yml (legacy tags v* / Dockerfile nginx).
on:
  push:
    tags:
      - "vibed-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tainalo2/devisgenerator-vibed

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=vibed-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=vibed-v(\d+\.\d+)\.\d+,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/vibed-v') }}
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/vibed-v') }}
          labels: |
            org.opencontainers.image.title=Devis Generator : VIBED
            org.opencontainers.image.description=Devis Generator : VIBED (Go + React)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vibed
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
