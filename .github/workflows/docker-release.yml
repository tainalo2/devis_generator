name: Docker release (site historique nginx)

# Trigger only on version tags (not also on release:published) so creating a
# GitHub Release for the same tag does not start a second identical build.
on:
  push:
    tags:
      # vX.Y.Z (and other v*) — exclude vibed-v* (VIBED has its own workflow).
      - "v*"
      - "!vibed-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tainalo2/devisgenerator

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      # Ce workflow construit le Dockerfile historique (site statique nginx).
      # L'application VIBED (Go + React) se publie avec « Publication vibed ».
      - name: Refuser la branche vibed
        if: github.ref_name == 'vibed' || startsWith(github.ref_name, 'feature/')
        run: |
          echo "::error::Ce workflow publie l'ancien site statique (Dockerfile nginx). Pour l'image VIBED, lancez « Publication vibed » ou poussez un tag vibed-vX.Y.Z."
          exit 1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
