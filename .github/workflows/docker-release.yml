name: Docker release (site historique nginx)

# Trigger only on version tags (not also on release:published) so creating a
# GitHub Release for the same tag does not start a second identical build.
on:
  push:
    tags:
      # vX.Y.Z (and other v*) — exclude vibed-v* (VIBED has its own workflow).
      - "v*"
      - "!vibed-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tainalo2/devisgenerator

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # Ce workflow construit le Dockerfile historique (site statique nginx).
      # L'application VIBED (Go + React) se publie avec « Publication vibed ».
      - name: Refuser la branche vibed
        if: github.ref_name == 'vibed' || startsWith(github.ref_name, 'feature/')
        run: |
          echo "::error::Ce workflow publie l'ancien site statique (Dockerfile nginx). Pour l'image VIBED, lancez « Publication vibed » ou poussez un tag vibed-vX.Y.Z."
          exit 1
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4e60bcf4feb106267204b3d4cda3 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521d6e9ea1bb5eb2a11c56af11 # v3
      - name: Log in to ghcr.io
        uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52bda2a190a446 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691021f7137bd4a6a016eb0 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0

      - name: Build and push
        uses: docker/build-push-action@5176660c9b1c65c99e2802907e6ff8214ffe573f # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
