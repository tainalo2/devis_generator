name: Docker release (site historique nginx)

# Trigger only on version tags (not also on release:published) so creating a
# GitHub Release for the same tag does not start a second identical build.
on:
  push:
    tags:
      # vX.Y.Z (and other v*) — exclude vibed-v* (VIBED has its own workflow).
      - "v*"
      - "!vibed-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tainalo2/devisgenerator

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # Ce workflow construit le Dockerfile historique (site statique nginx).
      # L'application VIBED (Go + React) se publie avec « Publication vibed ».
      - name: Refuser la branche vibed
        if: github.ref_name == 'vibed' || startsWith(github.ref_name, 'feature/')
        run: |
          echo "::error::Ce workflow publie l'ancien site statique (Dockerfile nginx). Pour l'image VIBED, lancez « Publication vibed » ou poussez un tag vibed-vX.Y.Z."
          exit 1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
