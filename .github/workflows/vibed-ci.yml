name: Vibed CI

on:
  push:
    branches: [vibed]
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.yaml"
      - "Dockerfile.vibed"
      - "Makefile"
      - ".github/workflows/vibed-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4
      - uses: actions/setup-go@b4582d6b1d0fa8d46a959c40cb8417c0db91a816 # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o /tmp/devis-server ./cmd/server

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4
      - uses: actions/setup-node@60edb5dd545a775178fbb8726081d25f3ed4ef69 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4
      - uses: docker/setup-buildx-action@988b5a0280414f521d6e9ea1bb5eb2a11c56af11 # v3
      - uses: docker/build-push-action@5176660c9b1c65c99e2802907e6ff8214ffe573f # v6
        with:
          context: .
          file: Dockerfile.vibed
          push: false
          tags: devis-generator-vibed:ci

          cache-from: type=gha
          cache-to: type=gha,mode=max
