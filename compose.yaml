services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devis
      POSTGRES_PASSWORD: devis
      POSTGRES_DB: devis
    # Exposé uniquement sur la machine locale (identifiants de développement).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devis -d devis"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.vibed
    environment:
      ADDR: "0.0.0.0:8080"
      SHUTDOWN_TIMEOUT: "10s"
      DATABASE_URL: postgres://devis:devis@db:5432/devis?sslmode=disable
      STATIC_DIR: /app/frontend/dist
      APP_ENV: development
      # Défauts de développement uniquement — remplacer en prod / staging.
      SESSION_SECRET: "dev-only-session-secret-change-me-32b"
      ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
