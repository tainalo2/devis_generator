<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Barre d’étapes, mobile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/devisui/components/bundle.css">
<script src="ds/devisui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@font-face{font-family:"Geist Variable";src:url("ds/devisui/fonts/geist-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Fraunces Variable";src:url("ds/devisui/fonts/fraunces-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:swap}
.dg-root{--font-heading:"Fraunces Variable","Fraunces",Georgia,serif;--font-sans:"Geist Variable","Geist",ui-sans-serif,sans-serif;--radius:0.5rem;--radius-md:calc(var(--radius)*0.8);--radius-lg:var(--radius);--radius-xl:calc(var(--radius)*1.4);--radius-2xl:calc(var(--radius)*1.8);
--background:oklch(0.985 0.008 220);--foreground:oklch(0.22 0.03 240);--card:oklch(0.995 0.004 220);--popover:oklch(0.995 0.004 220);--primary:oklch(0.32 0.05 240);--primary-foreground:oklch(0.98 0.01 220);--secondary:oklch(0.94 0.015 200);--secondary-foreground:oklch(0.28 0.04 240);--muted:oklch(0.945 0.012 210);--muted-foreground:oklch(0.48 0.025 240);--accent:oklch(0.93 0.03 195);--destructive:oklch(0.55 0.2 25);--border:oklch(0.88 0.015 220);--input:oklch(0.9 0.015 220);--ring:oklch(0.55 0.08 200);--brand:oklch(0.48 0.1 195);--brand-foreground:oklch(0.98 0.01 195)}
.dg-root .dg-button{white-space:nowrap}
.dg-root .dg-tall{height:44px;padding:0 14px;font-size:14px}
.dg-root .dg-touch{width:44px;height:44px}
</style>
</helmet>
<div class="dg-root" style="width: 100%; height: 76px; box-sizing: border-box; padding: 0 12px 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-family: var(--font-sans); color: var(--foreground); background-color: var(--card); border-top: 1px solid var(--border); box-shadow: 0 -8px 16px -12px rgb(15 40 60 / 0.25);">
<div role="status" style="display: flex; flex-direction: column; gap: 0; min-width: 0;">
<span style="font-size: 12px; line-height: 16px; color: var(--muted-foreground); white-space: nowrap;">{{label}}</span>
<span style="font-family: var(--font-heading); font-optical-sizing: auto; font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; white-space: nowrap;">{{value}}</span>
</div>
<div style="display: flex; align-items: center; gap: 8px;">
<sc-if value="{{hasPrev}}" hint-placeholder-val="{{false}}">
<x-import component-from-global-scope="DevisUI.Button" variant="outline" size="icon" class="dg-touch" aria-label="Étape précédente" on-click="{{prev}}">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
</x-import>
</sc-if>
<sc-if value="{{isLast}}" hint-placeholder-val="{{false}}">
<x-import component-from-global-scope="DevisUI.Button" variant="default" class="dg-tall">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>
Télécharger le PDF
</x-import>
</sc-if>
<sc-if value="{{notLast}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="DevisUI.Button" variant="default" class="dg-tall" on-click="{{next}}">
{{nextLabel}}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
</x-import>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["devis","facture","acompte"],"default":"devis"},"step":{"editor":"int","min":1,"max":3,"default":1},"onPrev":{"editor":null},"onNext":{"editor":null},"$preview":{"width":390,"height":76}}'>
class Component extends DCLogic {
renderVals() {
var k = this.props.kind || 'devis';
var s = this.props.step || 1;
var p = this.props.onPrev, n = this.props.onNext;
var labels = { devis: 'Total du devis', facture: 'Net à payer', acompte: 'Acompte à payer' };
return {
label: labels[k],
value: k === 'acompte' ? '735,00 €' : '2 450,00 €',
hasPrev: s > 1,
isLast: s >= 3,
notLast: s < 3,
nextLabel: s === 1 ? 'Lignes' : 'Aperçu',
prev: function () { if (p) p(); },
next: function () { if (n) n(); }
};
}
}
</script>
</body>
</html>
