<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Landing, soutien</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/devisui/components/bundle.css">
<script src="ds/devisui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@font-face{font-family:"Geist Variable";src:url("ds/devisui/fonts/geist-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Fraunces Variable";src:url("ds/devisui/fonts/fraunces-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:swap}
.dg-root{--font-heading:"Fraunces Variable","Fraunces",Georgia,serif;--font-sans:"Geist Variable","Geist",ui-sans-serif,sans-serif;--radius:0.5rem;--radius-md:calc(var(--radius)*0.8);--radius-lg:var(--radius);--radius-xl:calc(var(--radius)*1.4);--radius-2xl:calc(var(--radius)*1.8);
--background:oklch(0.985 0.008 220);--foreground:oklch(0.22 0.03 240);--card:oklch(0.995 0.004 220);--popover:oklch(0.995 0.004 220);--primary:oklch(0.32 0.05 240);--primary-foreground:oklch(0.98 0.01 220);--secondary:oklch(0.94 0.015 200);--secondary-foreground:oklch(0.28 0.04 240);--muted:oklch(0.945 0.012 210);--muted-foreground:oklch(0.48 0.025 240);--accent:oklch(0.93 0.03 195);--destructive:oklch(0.55 0.2 25);--border:oklch(0.88 0.015 220);--input:oklch(0.9 0.015 220);--ring:oklch(0.55 0.08 200);--brand:oklch(0.48 0.1 195);--brand-foreground:oklch(0.98 0.01 195)}
.dg-root .dg-button{white-space:nowrap}
.dg-root .dg-full{width:100%;height:44px}
</style>
</helmet>
<section class="dg-root" style="width: 100%; min-height: {{minH}}; box-sizing: border-box; display: flex; align-items: center; font-family: var(--font-sans); color: var(--foreground); background-color: color-mix(in oklab, var(--muted) 40%, var(--background)); border-top: 1px solid color-mix(in oklab, var(--border) 70%, transparent); border-bottom: 1px solid color-mix(in oklab, var(--border) 70%, transparent);">
<div style="width: 100%; max-width: 1152px; margin: 0 auto; padding: {{padY}} clamp(16px, 4vw, 32px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px;">
<div style="flex: 0 1 36rem; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
<h2 style="margin: 0; font-family: var(--font-heading); font-optical-sizing: auto; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.025em;">Soutenir VIBED</h2>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--muted-foreground);">L’outil est gratuit. Les dons restent optionnels ; aucun paiement n’est intégré dans l’application.</p>
</div>
<x-import component-from-global-scope="DevisUI.Button" variant="default" class="{{btnClass}}">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
Faire un don
</x-import>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"compact":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":180}}'>
class Component extends DCLogic {
renderVals() {
var c = !!this.props.compact;
return { minH: c ? '0px' : '180px', padY: c ? '40px' : '48px', btnClass: c ? 'dg-full' : '' };
}
}
</script>
</body>
</html>
