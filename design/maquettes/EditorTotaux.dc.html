<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Totaux</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/devisui/components/bundle.css">
<script src="ds/devisui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@font-face{font-family:"Geist Variable";src:url("ds/devisui/fonts/geist-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Fraunces Variable";src:url("ds/devisui/fonts/fraunces-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:swap}
.dg-root{--font-heading:"Fraunces Variable","Fraunces",Georgia,serif;--font-sans:"Geist Variable","Geist",ui-sans-serif,sans-serif;--radius:0.5rem;--radius-md:calc(var(--radius)*0.8);--radius-lg:var(--radius);--radius-xl:calc(var(--radius)*1.4);--radius-2xl:calc(var(--radius)*1.8);
--background:oklch(0.985 0.008 220);--foreground:oklch(0.22 0.03 240);--card:oklch(0.995 0.004 220);--popover:oklch(0.995 0.004 220);--primary:oklch(0.32 0.05 240);--primary-foreground:oklch(0.98 0.01 220);--secondary:oklch(0.94 0.015 200);--secondary-foreground:oklch(0.28 0.04 240);--muted:oklch(0.945 0.012 210);--muted-foreground:oklch(0.48 0.025 240);--accent:oklch(0.93 0.03 195);--destructive:oklch(0.55 0.2 25);--border:oklch(0.88 0.015 220);--input:oklch(0.9 0.015 220);--ring:oklch(0.55 0.08 200);--brand:oklch(0.48 0.1 195);--brand-foreground:oklch(0.98 0.01 195)}
</style>
</helmet>
<div class="dg-root" role="status" aria-label="Totaux du document" style="width: 100%; height: 72px; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; font-family: var(--font-sans); color: var(--foreground); background-color: var(--card); border-top: 1px solid var(--border); box-shadow: 0 -8px 16px -12px rgb(15 40 60 / 0.25);">
<div style="display: flex; gap: 24px; font-variant-numeric: tabular-nums;">
<sc-for list="{{items}}" as="it" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 12px; line-height: 16px; color: var(--muted-foreground); white-space: nowrap;">{{it.label}}</span>
<span style="font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap;">{{it.value}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 0;">
<span style="font-size: 12px; line-height: 16px; color: var(--muted-foreground); white-space: nowrap;">{{mainLabel}}</span>
<span style="font-family: var(--font-heading); font-optical-sizing: auto; font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; white-space: nowrap;">{{mainValue}}</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["devis","facture","acompte"],"default":"devis"},"$preview":{"width":600,"height":72}}'>
class Component extends DCLogic {
renderVals() {
var k = this.props.kind || 'devis';
if (k === 'acompte') {
return {
items: [{ label: 'Total du devis', value: '2 450,00 €' }, { label: 'Reste à facturer', value: '1 715,00 €' }],
mainLabel: 'Acompte à payer',
mainValue: '735,00 €'
};
}
return {
items: [{ label: 'Total HT', value: '2 450,00 €' }, { label: 'TVA', value: 'Non applicable' }],
mainLabel: k === 'facture' ? 'Net à payer' : 'Total du devis',
mainValue: '2 450,00 €'
};
}
}
</script>
</body>
</html>
